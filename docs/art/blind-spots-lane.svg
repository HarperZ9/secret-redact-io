<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages describing the honesty surface: rule list, shape, miss, target, metadata, query, argument, receipt. The policy is a fixed list of seven rules and nothing widens it at runtime. Each rule matches on shape, so a private key block, a key with a known prefix, or a value beside the word password is caught. A credential that reads as ordinary prose has no shape and passes through. The target field carries the name of the thing acted on rather than its content. Metadata is passed through exactly as the caller supplied it and no rule is applied to it. A fetch keeps only the scheme, host and path, so a token in a query string never reaches the receipt. An exec keeps only the base name of the program, so arguments never reach it either. The receipt is written from those fields plus two digests and the counts. Three outcomes: hash only, unmatched, and open field."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">SEVEN PATTERNS, AND THEIR EDGES</text><text class="h" x="44" y="72">Where a secret can still reach a receipt, and where it cannot</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H143.25V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">METADATA IS THE ONE FIELD NOTHING REDACTS</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Rule list</text><text class="s" x="58" y="168">Seven patterns, fixed at</text><text class="s" x="58" y="183">seven.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Shape</text><text class="s" x="282.5" y="168">A rule matches form, never</text><text class="s" x="282.5" y="183">meaning.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Miss</text><text class="s" x="507" y="168">A secret shaped like prose</text><text class="s" x="507" y="183">survives.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Target</text><text class="s" x="731.5" y="168">The name of the thing, not its</text><text class="s" x="731.5" y="183">content.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Metadata</text><text class="s" x="58" y="360">Passed through. No rule is</text><text class="s" x="58" y="375">applied.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Query</text><text class="s" x="282.5" y="360">A fetch drops the query string</text><text class="s" x="282.5" y="375">whole.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Argument</text><text class="s" x="507" y="360">An exec keeps the program name</text><text class="s" x="507" y="375">only.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Receipt</text><text class="s" x="731.5" y="360">Two digests, the counts, four</text><text class="s" x="731.5" y="375">names.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">HASH ONLY</text><text class="s" x="58" y="509" font-size="10.5">the receipt holds digests, not text</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">UNMATCHED</text><text class="s" x="357.33" y="509" font-size="10.5">a secret the seven rules do not see</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">OPEN FIELD</text><text class="s" x="656.67" y="509" font-size="10.5">metadata goes in exactly as given</text><text class="s" x="44" y="546">A rule matches a shape. A credential that looks like ordinary prose has no shape to match, so it survives the pass.</text></svg>
