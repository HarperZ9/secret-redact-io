<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 564" width="960" height="564" font-family="Hanken Grotesk, Segoe UI, ui-sans-serif, system-ui, sans-serif" role="img" aria-label="Eight stages from call to return: call, raw bytes, policy, redact, persist, count, receipt, return. A call is one of four guarded operations: read a file, write a file, fetch a URL, run a program. The raw bytes come back from the file, the host or the process. The policy is a list of seven patterns applied in order. Each match is replaced by the name of the rule that matched it. On the write path the redacted text is what lands on disk, so the file is changed and not only the return value. The counts record how many times each rule fired. The receipt carries nine keys and none of them holds secret text. The caller receives the redacted text, which is the same text a write persisted. Three outcomes: redacted, untouched, and still leaking."><style>
  :root{ --void:#f4f3ef; --bone:#0b0c0e; --muted:#43474e;
    --hairline:rgba(11,12,14,.16); --card:rgba(255,255,255,.66);
    --verified:#1f7a52; --drift:#3a2bd6; }
  @media (prefers-color-scheme: dark){
    :root{ --void:#0b0e0f; --bone:#eef1ee; --muted:#9aa39c;
      --hairline:rgba(238,241,238,.18); --card:rgba(255,255,255,.05);
      --verified:#5fae93; --drift:#a99cf5; } }
  .bg{ fill:var(--void); }
  .card{ fill:var(--card); stroke:var(--hairline); stroke-width:1.4; }
  .n{ fill:var(--bone); font-size:15px; font-weight:650; }
  .s{ fill:var(--muted); font-size:11.5px; }
  .k{ fill:var(--muted); font-size:11px; letter-spacing:.16em; }
  .h{ fill:var(--bone); font-size:21px; font-weight:700; }
  .fwd{ stroke:var(--verified); stroke-width:2; fill:none; }
  .back{ stroke:var(--drift); stroke-width:1.8; fill:none; stroke-dasharray:5 4; }
  .thin{ stroke:var(--hairline); stroke-width:1.4; fill:none; }
  .step{ fill:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; }
</style><marker id="af" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--verified)"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="var(--drift)"/></marker><rect class="bg" width="960" height="564"/><text class="k" x="44" y="40" font-family="Conso, ui-monospace, Cascadia Mono, Consolas, monospace">ONE CALL, ONE RECEIPT</text><text class="h" x="44" y="72">What happens to a secret between the call and the caller</text><path class="fwd" marker-end="url(#af)" d="M246.5 158H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 158H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 158H710.5"/><path class="fwd" marker-end="url(#af)" d="M920 158H940V276H20V350H37"/><path class="fwd" marker-end="url(#af)" d="M246.5 350H261.5"/><path class="fwd" marker-end="url(#af)" d="M471 350H486"/><path class="fwd" marker-end="url(#af)" d="M695.5 350H710.5"/><path class="back" marker-end="url(#ab)" d="M816.75 398V420H143.25V405"/><text class="k" x="480" y="437" text-anchor="middle" fill="var(--drift)">ONLY THE REDACTED TEXT IS EVER PERSISTED</text><g><rect class="card" x="44" y="110" width="198.5" height="96" rx="3"/><text class="step" x="58" y="101">01</text><text class="n" x="58" y="142">Call</text><text class="s" x="58" y="168">One of four: read, write,</text><text class="s" x="58" y="183">fetch, run.</text></g><g><rect class="card" x="268.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="101">02</text><text class="n" x="282.5" y="142">Raw bytes</text><text class="s" x="282.5" y="168">What the file, host or process</text><text class="s" x="282.5" y="183">gave back.</text></g><g><rect class="card" x="493" y="110" width="198.5" height="96" rx="3"/><text class="step" x="507" y="101">03</text><text class="n" x="507" y="142">Policy</text><text class="s" x="507" y="168">Seven patterns, applied in</text><text class="s" x="507" y="183">order.</text></g><g><rect class="card" x="717.5" y="110" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="101">04</text><text class="n" x="731.5" y="142">Redact</text><text class="s" x="731.5" y="168">Each match swapped for its</text><text class="s" x="731.5" y="183">rule name.</text></g><g><rect class="card" x="44" y="302" width="198.5" height="96" rx="3"/><text class="step" x="58" y="293">05</text><text class="n" x="58" y="334">Persist</text><text class="s" x="58" y="360">On a write, the redacted text</text><text class="s" x="58" y="375">lands on disk.</text></g><g><rect class="card" x="268.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="282.5" y="293">06</text><text class="n" x="282.5" y="334">Count</text><text class="s" x="282.5" y="360">How many times each rule</text><text class="s" x="282.5" y="375">fired.</text></g><g><rect class="card" x="493" y="302" width="198.5" height="96" rx="3"/><text class="step" x="507" y="293">07</text><text class="n" x="507" y="334">Receipt</text><text class="s" x="507" y="360">Nine keys, and no secret text</text><text class="s" x="507" y="375">in them.</text></g><g><rect class="card" x="717.5" y="302" width="198.5" height="96" rx="3"/><text class="step" x="731.5" y="293">08</text><text class="n" x="731.5" y="334">Return</text><text class="s" x="731.5" y="360">The caller is handed the</text><text class="s" x="731.5" y="375">redacted text.</text></g><path class="thin" d="M816.75 398V448"/><path class="thin" d="M816.75 448H180.67V472"/><rect x="44" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--verified)" stroke-width="1.6"/><text class="n" x="58" y="493" font-size="13">REDACTED</text><text class="s" x="58" y="509" font-size="10.5">each match replaced by its rule name</text><path class="thin" d="M816.75 448H480V472"/><rect x="343.33" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--muted)" stroke-width="1.6"/><text class="n" x="357.33" y="493" font-size="13">UNTOUCHED</text><text class="s" x="357.33" y="509" font-size="10.5">no rule matched, so nothing changed</text><path class="thin" d="M816.75 448H779.33V472"/><rect x="642.67" y="472" width="273.33" height="46" rx="3" fill="none" stroke="var(--drift)" stroke-width="1.6"/><text class="n" x="656.67" y="493" font-size="13">STILL LEAKING</text><text class="s" x="656.67" y="509" font-size="10.5">a secret shape no rule describes</text><text class="s" x="44" y="546">The receipt is built from both texts and keeps neither. Its digests are over the bytes, not a copy of them.</text></svg>
